# The build (which fails on any colour pair short of its WCAG minimum, a pair
# it doesn't measure, or the CSS over its size budget), released versions
# left alone, the unit tests, dist/ being up to date with its sources, and
# the showcase in a real browser: axe in light, dark, English and Arabic, and
# the helpers' behaviour with real key presses.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, and fail if dist/ or the contrast report weren't rebuilt
        run: |
          node scripts/build.mjs
          git diff --exit-code -- dist docs/contrast.md
      - name: Released versions (v/) are never changed, only added
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --exit-code --diff-filter=MDR "$base" HEAD -- v/
          fi
      - name: Unit tests
        run: node --test "tests/*.test.js"
      - name: The showcase in Chrome
        run: |
          npm i --no-save axe-core@4.10.2
          CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check-page.mjs
