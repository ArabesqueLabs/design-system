# The build (which fails on any colour pair short of its WCAG minimum, a pair
# it doesn't measure, or the CSS over its size budget), and the React build
# (which fails on a type error, or an example with no Arabic); released
# versions left alone; the unit tests; dist/, the examples and the template
# up to date with their sources; and the showcase, the examples and the
# template in a real browser: axe in light, dark, English and Arabic, and the
# helpers' behaviour with real key presses.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build, and fail if dist/, the contrast report, the examples, the template or the document pages weren't rebuilt
        run: |
          node scripts/build.mjs
          node scripts/build-react.mjs
          git diff --exit-code -- dist docs examples templates index.html README.html ar/README.html CHANGELOG.html
      - name: Released versions (v/) are never changed, only added
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --exit-code --diff-filter=MDR "$base" HEAD -- v/
          fi
      - name: Unit tests
        run: node --test "tests/*.test.js"
      - name: The showcase, the examples and the template in Chrome
        run: |
          npm i --no-save axe-core@4.10.2
          CHROME="$(command -v google-chrome || command -v chromium)" node scripts/check-page.mjs
